
services:
  ai-agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-agent-lab:latest
    container_name: ai-agent-lab
    working_dir: /workspace
    env_file:
      - .env
    volumes:
      - .:/workspace
    ports:
      - "6006:6006"
      - "8000:8000"
    init: true
    tty: true
    stdin_open: true
    restart: unless-stopped
